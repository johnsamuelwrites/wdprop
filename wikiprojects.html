<!DOCTYPE HTML>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDProp: WikiProjects: John Samuel</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" type="text/css" href="style.css" />
    <script src="theme.js"></script>
    <script defer src="ready.js"></script>
    <script defer src="activity.js"></script>
    <script defer src="shell.js"></script>
    <script defer src="actions.js"></script>
    <script defer src="pager.js"></script>
    <script defer type="text/javascript" src="i18n.js"></script>
    <script defer type="text/javascript" src="i18n/en.js"></script>
    <script defer type="text/javascript" src="mwwdprop.js"></script>
    <script defer type="text/javascript" src="wdprop.js"></script>
    <script defer type="text/javascript" src="offline.js"></script>
    <script defer src="wikiprojectsview.js"></script>
    <script defer src="pageinit.js"></script>
</head>

<body>
    <wdprop-shell></wdprop-shell>
    <div id="content" role="main" tabindex="-1">

        <!-- Hero -->
        <div class="vst-hero">
            <h2 class="vst-hero-title" data-i18n="page.wikiProjects">WikiProjects</h2>
            <p class="vst-hero-subtitle" data-i18n="page.wikiProjectsIntro">Explore all Wikidata WikiProjects and their associated properties</p>
            <div class="vst-search-wrap">
                <span class="vst-search-icon">🔍</span>
                <input id="wp-search" type="text" class="vst-search-field" placeholder="Filter by project name…" autocomplete="off" />
            </div>
        </div>

        <div id="allWikiProjects"></div>

        <!-- Query section -->
        <div class="section search-query-section" id="wpQuerySection" style="display:none;">
            <button class="search-query-toggle" data-action="toggleWPQuery">
                <span class="search-query-toggle-icon">⚙️</span> Show API Query
                <span class="search-query-chevron">▼</span>
            </button>
            <div id="allWikiProjectsQuery" class="search-query-body" style="display:none;"></div>
        </div>

    </div>
    <div id="footer" role="contentinfo">
        <p id="footertext" data-i18n-html="app.footer">Powered by <a href="https://www.wikidata.org/">Wikidata</a> and <a href="https://mediawiki.org/">MediaWiki</a> API</p>
    </div>

</body>

</html>
