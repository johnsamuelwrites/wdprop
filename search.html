<!DOCTYPE HTML>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDProp: Search Properties: John Samuel</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" type="text/css" href="style.css" />
    <script src="theme.js"></script>
    <script defer src="ready.js"></script>
    <script defer src="activity.js"></script>
    <script defer src="shell.js"></script>
    <script defer src="actions.js"></script>
    <script defer src="pager.js"></script>
    <script defer type="text/javascript" src="i18n.js"></script>
    <script defer type="text/javascript" src="i18n/en.js"></script>
    <script defer src="download.js"></script>
    <script defer type="text/javascript" src="wdprop.js"></script>
    <!-- Both searches on this page go to the MediaWiki search index. -->
    <script defer type="text/javascript" src="mwwdprop.js"></script>
    <script defer type="text/javascript" src="offline.js"></script>
    <script defer src="searchview.js"></script>
    <script defer src="pageinit.js"></script>
</head>

<body>
    <wdprop-shell></wdprop-shell>
    <div id="content" role="main" tabindex="-1">

        <!-- Search Hero -->
        <div class="search-hero">
            <h2 class="search-hero-title" data-i18n="page.search">Search</h2>
            <p class="search-hero-subtitle" data-i18n="page.searchIntro">Find Wikidata properties or WikiProjects by keyword</p>

            <!-- Tabs -->
            <div class="search-tabs">
                <button class="search-tab active" id="tab-properties" data-action="switchSearchTab" data-arg="properties" data-i18n="page.tabProperties">
                    🔧 Properties
                </button>
                <button class="search-tab" id="tab-wikiprojects" data-action="switchSearchTab" data-arg="wikiprojects" data-i18n="page.tabWikiProjects">
                    🚀 WikiProjects
                </button>
            </div>

            <!-- Properties search panel -->
            <div class="search-panel active" id="panel-properties">
                <form action="./search.html" data-action="submitPropertySearch" class="search-form">
                    <div class="search-input-wrap">
                        <span class="search-input-icon">🔍</span>
                        <input id="search" name="search" type="text" class="search-field" placeholder="e.g. software, person, location…" autocomplete="off" />
                        <button type="submit" class="search-submit-btn" data-i18n="page.search">Search</button>
                    </div>
                </form>
                <div class="search-examples">
                    <span class="search-examples-label">Try:</span>
                    <a href="./search.html?search=software&language=en" class="search-chip">software</a>
                    <a href="./search.html?search=programming+language&language=en" class="search-chip">programming language</a>
                    <a href="./search.html?search=person&language=en" class="search-chip">person</a>
                    <a href="./search.html?search=location&language=en" class="search-chip">location</a>
                    <a href="./search.html?search=date&language=en" class="search-chip">date</a>
                </div>
            </div>

            <!-- WikiProjects search panel -->
            <div class="search-panel" id="panel-wikiprojects">
                <form action="./search.html" data-action="submitWikiProjectSearch" class="search-form">
                    <div class="search-input-wrap">
                        <span class="search-input-icon">🔍</span>
                        <input id="searchproject" name="searchproject" type="text" class="search-field" placeholder="e.g. heritage, biology, music…" autocomplete="off" />
                        <button type="submit" class="search-submit-btn" data-i18n="page.search">Search</button>
                    </div>
                </form>
                <div class="search-examples">
                    <span class="search-examples-label">Try:</span>
                    <a href="#" class="search-chip" data-action="fillAndSubmitProject" data-arg="heritage">heritage</a>
                    <a href="#" class="search-chip" data-action="fillAndSubmitProject" data-arg="biology">biology</a>
                    <a href="#" class="search-chip" data-action="fillAndSubmitProject" data-arg="music">music</a>
                    <a href="#" class="search-chip" data-action="fillAndSubmitProject" data-arg="geography">geography</a>
                </div>
            </div>
        </div>

        <!--
            Pages of WDProp itself whose name or description matches what was
            typed, above the properties. Someone searching for "atlas" or
            "provenance" is at least as likely to be looking for the page as
            for a property, and until now the search could only answer with
            properties. Filled by searchview.js from the list of pages, which
            is already in the browser: no request, and no wait.
        -->
        <div class="section" id="pageMatchesSection" style="display:none;">
            <h2 data-i18n="page.matchingPages">Pages in WDProp</h2>
            <div id="pageMatches"></div>
        </div>

        <!-- Results -->
        <div class="section" id="resultsSection" style="display:none;">
            <div id="searchResults"></div>
        </div>

        <!-- Query (collapsed by default) -->
        <div class="section search-query-section" id="querySection" style="display:none;">
            <!--
                Not SPARQL any more: both tabs ask the search index, so what
                this reveals is the API request that was made. It said "Show
                SPARQL Query" in English on every page whatever the interface
                language, which was two things wrong with one line.
            -->
            <button class="search-query-toggle" data-action="toggleQuerySection">
                <span class="search-query-toggle-icon">⚙️</span>
                <span data-i18n="page.showRequest">Show the request</span>
                <span class="search-query-chevron">▼</span>
            </button>
            <div id="searchResultsQuery" class="search-query-body" style="display:none;"></div>
        </div>

    </div>
    <div id="footer" role="contentinfo">
        <p id="footertext" data-i18n-html="app.footer">Powered by <a href="https://www.wikidata.org/">Wikidata</a> and <a href="https://mediawiki.org/">MediaWiki</a> API</p>
    </div>

</body>

</html>
