<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDProp: Language Codes: John Samuel</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" type="text/css" href="style.css" />
    <script src="theme.js"></script>
    <script defer src="ready.js"></script>
    <script defer src="activity.js"></script>
    <script defer src="shell.js"></script>
    <script defer src="actions.js"></script>
    <script defer src="pager.js"></script>
    <script defer type="text/javascript" src="i18n.js"></script>
    <script defer type="text/javascript" src="i18n/en.js"></script>
    <script defer type="text/javascript" src="wdprop.js"></script>
    <script defer type="text/javascript" src="offline.js"></script>
    <script defer src="visualization.js"></script>
    <script defer src="pageinit.js"></script>
</head>

<body>
    <wdprop-shell></wdprop-shell>
    <div id="content" role="main" tabindex="-1">

        <!-- Hero with search -->
        <div class="viz-hero">
            <h2 class="viz-hero-title" data-i18n="page.languageCodes">Language Codes</h2>
            <p class="viz-hero-subtitle" data-i18n="page.allLanguagesIntro">All languages supported by Wikidata properties — search by code or name</p>
            <div class="viz-search-wrap">
                <span class="viz-search-icon">🔍</span>
                <input id="viz-search" type="text" class="viz-search-field" placeholder="e.g. French, de, be-tarask…" autocomplete="off" />
            </div>
        </div>

        <!-- Status / error messages -->
        <div id="viz-loading" class="wdprop-loading" style="display:block;"></div>
        <p id="viz-error" class="viz-status viz-status-error" style="display:none;" data-i18n="page.fetchFailed">Failed to fetch data. Please check your connection and try again.</p>

        <!-- Table -->
        <div class="viz-table-wrapper">
            <div class="viz-table-header">
                <span class="viz-table-count">Showing <strong id="viz-count">…</strong> languages</span>
            </div>
            <table class="viz-table">
                <thead>
                    <tr>
                        <th data-i18n="page.code">Code</th>
                        <th data-i18n="page.language">Language</th>
                    </tr>
                </thead>
                <tbody id="viz-tbody">
                </tbody>
            </table>
        </div>

    </div>
    <div id="footer" role="contentinfo">
        <p id="footertext" data-i18n-html="app.footer">Powered by <a href="https://www.wikidata.org/">Wikidata</a> and <a href="https://mediawiki.org/">MediaWiki</a> API</p>
    </div>
</body>

</html>
