<!DOCTYPE HTML>
<html>

<head>
    <meta charset="utf-8" />
    <title>WDProp: Translation campaign: John Samuel</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
    <script type="text/javascript" src="i18n.js"></script>
    <script type="text/javascript" src="i18n/en.js"></script>
    <script type="text/javascript" src="wdprop.js">
    </script>
    <script type="text/javascript" src="cart.js">
    </script>
    <script type="text/javascript" src="qs.js">
    </script>
    <script type="text/javascript" src="campaign.js">
    </script>
</head>

<body>
    <a href="#content" class="skip-link" data-i18n="a11y.skip">Skip to main content</a>
    <div id="mobile-menu-toggle" role="button" tabindex="0" aria-expanded="false"
         onclick="toggleMobileMenu()" data-i18n-label="a11y.menuToggle">
        <span></span>
        <span></span>
        <span></span>
    </div>
    <div id="header" role="banner">
        <div id="logo"><a href="./index.html">WDProp</a>
            <span id="subtitle" data-i18n="app.subtitle">Everything about Wikidata properties</span>
        </div>
        <div id="theme-toggle" role="button" tabindex="0" onclick="toggleTheme()"
             data-i18n-label="a11y.themeToggle" data-i18n-title="a11y.themeToggle"></div>
    </div>
    <div id="sidebar" role="navigation" data-i18n-label="a11y.nav">
        <div id="sidebarlinks"></div>
    </div>
    <div id="content" role="main" tabindex="-1">
        <div class="section">
            <h2 data-i18n="campaign.heading">Translation campaign</h2>
            <p class="wdp-muted" data-i18n="campaign.intro">A language and a set of properties.</p>
            <form id="campaignForm" class="wb-controls">
                <div class="wb-control">
                    <label for="cmTarget" data-i18n="campaign.language">Language</label>
                    <input type="text" id="cmTarget" class="wdp-input wdp-input-small" size="6" autocomplete="off" />
                </div>
                <div class="wb-control">
                    <label for="cmScope" data-i18n="campaign.properties">Properties</label>
                    <select id="cmScope" class="wdp-input">
                        <option value="class" data-i18n="campaign.scopeClass">In a property class</option>
                        <option value="datatype" data-i18n="campaign.scopeDatatype">With a datatype</option>
                        <option value="wikiproject" data-i18n="campaign.scopeWikiProject">Linked from a WikiProject</option>
                        <option value="properties" data-i18n="campaign.scopeList">A list I paste</option>
                    </select>
                    <input type="text" id="cmScopeValue" class="wdp-input" size="26" autocomplete="off"
                           placeholder="Q18616576" />
                </div>
                <div class="wb-control">
                    <button type="submit" class="wdp-button wdp-primary" data-i18n="campaign.measure">Measure progress</button>
                </div>
            </form>
        </div>
        <div class="section">
            <div id="campaignHeading"></div>
            <div id="campaignGoals"></div>
        </div>
        <div class="section">
            <h3 data-i18n="campaign.shareHeading">Share this campaign</h3>
            <div id="campaignShare"></div>
        </div>
    </div>
    <div id="footer" role="contentinfo">
        <p id="footertext" data-i18n-html="app.footer">Powered by <a href="https://www.wikidata.org/">Wikidata</a> and <a href="https://mediawiki.org/">MediaWiki</a> API</p>
    </div>
</body>

</html>
