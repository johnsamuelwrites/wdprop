<!DOCTYPE HTML>
<html>

<head>
    <meta charset="utf-8" />
    <title>WDProp: Translation batch: John Samuel</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" type="text/css" href="style.css" />
    <script src="theme.js"></script>
    <script defer src="ready.js"></script>
    <script defer src="activity.js"></script>
    <script defer src="shell.js"></script>
    <script defer src="actions.js"></script>
    <script defer src="pager.js"></script>
    <script defer type="text/javascript" src="i18n.js"></script>
    <script defer type="text/javascript" src="i18n/en.js"></script>
    <script defer type="text/javascript" src="wdprop.js">
    </script>
    <script defer type="text/javascript" src="offline.js"></script>
    <script defer type="text/javascript" src="cart.js">
    </script>
    <script defer type="text/javascript" src="qs.js">
    </script>
    <script defer type="text/javascript" src="validate.js">
    </script>
    <script defer type="text/javascript" src="contributions.js">
    </script>
    <script defer type="text/javascript" src="batch.js">
    </script>
    <script defer src="pageinit.js"></script>
</head>

<body>
    <wdprop-shell></wdprop-shell>
    <div id="content" role="main" tabindex="-1">
        <div class="section">
            <h2 data-i18n="batch.heading">Translation batch</h2>
            <p data-i18n-html="batch.intro">Translations you have proposed are kept in this browser.</p>
            <p class="wdp-muted" data-i18n-html="batch.howto">Use the translation workbench.</p>
        </div>
        <div class="section">
            <div id="batchSummary"></div>
            <div id="batchEntries"></div>
            <p>
                <button type="button" id="batchRecheck" class="wdp-button" data-i18n="common.checkAgain">Check again</button>
                <button type="button" id="batchClear" class="wdp-button" data-i18n="batch.empty">Empty the batch</button>
            </p>
        </div>
        <div class="section">
            <h2 data-i18n="batch.commandsHeading">QuickStatements commands</h2>
            <p class="wdp-muted" data-i18n="batch.commandsHint">These are the exact edits that will be made.</p>
            <div id="batchCommands"></div>
        </div>
        <div class="section">
            <h2 data-i18n="batch.exportHeading">Export</h2>
            <div id="batchExport"></div>
        </div>
    </div>
    <div id="footer" role="contentinfo">
        <p id="footertext" data-i18n-html="app.footer">Powered by <a href="https://www.wikidata.org/">Wikidata</a> and <a href="https://mediawiki.org/">MediaWiki</a> API</p>
    </div>
</body>

</html>
