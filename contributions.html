    <script src="theme.js"></script>
    <script defer src="ready.js"></script>
    <script defer src="activity.js"></script>
    <script defer src="shell.js"></script>

<body>
    <wdprop-shell></wdprop-shell>
    <div id="content" role="main" tabindex="-1">
        <div class="section">
            <h2 data-i18n="contributions.heading">My contributions</h2>
            <p class="wdp-muted" data-i18n="contributions.intro">What you have exported to QuickStatements.</p>

        </div>
        <div class="section">
            <div id="contributionsSummary"></div>
            <p>
                <button type="button" id="contributionsRecheck" class="wdp-button" data-i18n="common.checkAgain">Check again</button>
                <button type="button" id="contributionsClear" class="wdp-button" data-i18n="contributions.forgetAll">Forget all history</button>
            </p>
        </div>
        <div class="section">
            <div id="contributionsBatches"></div>
        </div>
    </div>
    <div id="footer" role="contentinfo">
        <p id="footertext" data-i18n-html="app.footer">Powered by <a href="https://www.wikidata.org/">Wikidata</a> and <a href="https://mediawiki.org/">MediaWiki</a> API</p>
