<!DOCTYPE HTML>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDProp: Compare Languages: John Samuel</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
    <script type="text/javascript" src="i18n.js"></script>
    <script type="text/javascript" src="i18n/en.js"></script>
    <script type="text/javascript" src="wdprop.js"></script>
    <script type="text/javascript" src="compare.js"></script>
</head>

<body onload="getComparisonResultsOnLoad()">
    <a href="#content" class="skip-link" data-i18n="a11y.skip">Skip to main content</a>
    <div id="mobile-menu-toggle" role="button" tabindex="0" aria-expanded="false"
         onclick="toggleMobileMenu()" data-i18n-label="a11y.menuToggle">
        <span></span>
        <span></span>
        <span></span>
    </div>
    <div id="header" role="banner">
        <div id="logo"><a href="./index.html">WDProp</a>
            <span id="subtitle" data-i18n="app.subtitle">Everything about Wikidata properties</span>
        </div>
        <div id="theme-toggle" role="button" tabindex="0" onclick="toggleTheme()"
             data-i18n-label="a11y.themeToggle" data-i18n-title="a11y.themeToggle"></div>
    </div>
    <div id="sidebar" role="navigation" data-i18n-label="a11y.nav">
        <div id="sidebarlinks"></div>
    </div>
    <div id="content" role="main" tabindex="-1">

        <!-- Compare Hero -->
        <div class="compare-hero">
            <h2 class="compare-hero-title" data-i18n="page.compareLanguages">Compare Languages</h2>
            <p class="compare-hero-subtitle" data-i18n="page.compareIntro">Compare translation coverage across Wikidata properties</p>

            <form action="./compare.html" onsubmit="getComparisonResultsOnEvent(event, this)" class="compare-form">
                <div class="compare-input-wrap">
                    <span class="compare-input-icon">🌍</span>
                    <input id="languages" name="languages" type="text" class="compare-field" placeholder="e.g. en, fr, de, es" autocomplete="off" value="en, fr" />
                    <button type="submit" class="compare-submit-btn" data-i18n="page.compare">Compare</button>
                </div>
            </form>

            <div class="compare-examples">
                <span class="compare-examples-label">Try:</span>
                <a href="./compare.html?languages=en,fr" class="compare-chip">en, fr</a>
                <a href="./compare.html?languages=en,fr,de" class="compare-chip">en, fr, de</a>
                <a href="./compare.html?languages=en,fr,de,es" class="compare-chip">en, fr, de, es</a>
                <a href="./compare.html?languages=en,fr,de,es,ja" class="compare-chip">en, fr, de, es, ja</a>
                <a href="./languages.html" class="compare-chip compare-chip-ref">🔍 All language codes</a>
            </div>
        </div>

        <!-- Hidden: original chip output consumed by compare.js -->
        <div id="comparisonResults" style="display:none;"></div>

        <!-- Chart area -->
        <div class="compare-results" id="compareChartArea" style="display:none;">

            <!-- Category tabs -->
            <div class="compare-tabs">
                <button class="compare-tab active" id="ctab-labels" onclick="switchCompareTab('labels')" data-i18n="page.tabLabels">
                    🏷️ Labels
                </button>
                <button class="compare-tab" id="ctab-descriptions" onclick="switchCompareTab('descriptions')" data-i18n="page.tabDescriptions">
                    📝 Descriptions
                </button>
                <button class="compare-tab" id="ctab-aliases" onclick="switchCompareTab('aliases')" data-i18n="page.tabAliases">
                    🔀 Aliases
                </button>
            </div>

            <!-- Chart panels -->
            <div class="compare-chart-panel active" id="cpanel-labels">
                <div id="compare-chart-labels" class="compare-chart"></div>
            </div>
            <div class="compare-chart-panel" id="cpanel-descriptions">
                <div id="compare-chart-descriptions" class="compare-chart"></div>
            </div>
            <div class="compare-chart-panel" id="cpanel-aliases">
                <div id="compare-chart-aliases" class="compare-chart"></div>
            </div>

            <!-- Shareable URL -->
            <div class="compare-url-row" id="compareURLRow"></div>
        </div>

    </div>
    <div id="footer" role="contentinfo">
        <p id="footertext" data-i18n-html="app.footer">Powered by <a href="https://www.wikidata.org/">Wikidata</a> and <a href="https://mediawiki.org/">MediaWiki</a> API</p>
    </div>
</body>

</html>
