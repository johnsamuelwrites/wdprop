<!DOCTYPE HTML>
<html>

<head>
    <meta charset="utf-8" />
    <title>WDProp: Translation workbench: John Samuel</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" type="text/css" href="style.css" />
    <script src="theme.js"></script>
    <script defer src="ready.js"></script>
    <script defer src="activity.js"></script>
    <script defer src="shell.js"></script>
    <script defer src="actions.js"></script>
    <script defer src="pager.js"></script>
    <script defer type="text/javascript" src="i18n.js"></script>
    <script defer type="text/javascript" src="i18n/en.js"></script>
    <script defer type="text/javascript" src="wdprop.js">
    </script>
    <script defer type="text/javascript" src="offline.js"></script>
    <script defer type="text/javascript" src="cart.js">
    </script>
    <script defer type="text/javascript" src="validate.js">
    </script>
    <script defer type="text/javascript" src="usage.js"></script>
    <script defer type="text/javascript" src="translate.js">
    </script>
    <script defer src="pageinit.js"></script>
</head>

<body>
    <wdprop-shell></wdprop-shell>
    <div id="content" role="main" tabindex="-1">
        <div class="section">
            <h2 data-i18n="translate.heading">Translation workbench</h2>
            <p class="wdp-muted" data-i18n-html="translate.intro">Properties that still need a translation.</p>
            <form id="workbenchControls" class="wb-controls">
                <div class="wb-control">
                    <label for="wbPivots" data-i18n="translate.read">I read</label>
                    <input type="text" id="wbPivots" class="wdp-input" size="12" autocomplete="off" />
                    <span class="wdp-muted" data-i18n="translate.readHint">one code, or several separated by commas</span>
                </div>
                <div class="wb-control">
                    <label for="wbTarget" data-i18n="translate.into">I translate into</label>
                    <input type="text" id="wbTarget" class="wdp-input wdp-input-small" size="6" autocomplete="off" />
                </div>
                <div class="wb-control">
                    <label for="wbType" data-i18n="translate.missing">Missing</label>
                    <select id="wbType" class="wdp-input">
                        <option value="label" data-i18n="term.labels">Labels</option>
                        <option value="description" data-i18n="term.descriptions">Descriptions</option>
                        <option value="alias" data-i18n="term.aliases">Aliases</option>
                    </select>
                </div>
                <div class="wb-control">
                    <label for="wbScope" data-i18n="translate.among">Among</label>
                    <select id="wbScope" class="wdp-input">
                        <option value="all" data-i18n="translate.scopeAll">All properties</option>
                        <option value="class" data-i18n="translate.scopeClass">A property class</option>
                        <option value="datatype" data-i18n="translate.scopeDatatype">A datatype</option>
                        <option value="properties" data-i18n="translate.scopeProperties">A list of properties</option>
                        <option value="top" data-i18n="translate.scopeTop">The 100 most used properties</option>
                    </select>
                    <input type="text" id="wbScopeValue" class="wdp-input" size="14" autocomplete="off"
                           placeholder="Q18616576" />
                </div>
                <div class="wb-control">
                    <button type="submit" class="wdp-button wdp-primary" data-i18n="translate.load">Load worklist</button>
                </div>
            </form>
        </div>
        <div class="section">
            <div id="workbenchProgress"></div>
            <div id="workbenchRows"></div>
            <div id="workbenchPager"></div>
        </div>
        <div class="section">
            <h3 data-i18n="translate.keyboard">Keyboard</h3>
            <p class="wdp-muted" data-i18n-html="translate.keyboardHelp">Keyboard shortcuts.</p>
        </div>
    </div>
    <div id="footer" role="contentinfo">
        <p id="footertext" data-i18n-html="app.footer">Powered by <a href="https://www.wikidata.org/">Wikidata</a> and <a href="https://mediawiki.org/">MediaWiki</a> API</p>
    </div>
</body>

</html>
